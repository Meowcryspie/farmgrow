<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const saved = localStorage.getItem("ec-theme");
        if (saved === "dark" || saved === "light") {
          document.querySelector('meta[name="color-scheme"]').content = saved;
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#12804F" />
    <meta name="description" content="EC Link - Remote management and monitoring for Autogrow EC Mini nutrient controllers across farms." />
    <title>EC Link · EC Mini Remote</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Google Fonts: IBM Plex Sans & IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
