<!doctype html>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const saved = localStorage.getItem("ec-theme");
        if (saved === "dark" || saved === "light") {
          document.querySelector('meta[name="color-scheme"]').content = saved;
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#12804F" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages routing decoder
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <meta name="description" content="EC Link - Remote management and monitoring for Autogrow EC Mini nutrient controllers across farms." />
